<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Calculator</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        <input type="text" id="display" value="0" readonly />
      </div>

      <div class="buttons">
        <button type="button" class="ac">ac</button>
        <button type="button" class="negate">
          <i class="fa-solid fa-plus-minus"></i>
        </button>
        <button type="button" class="hundred">%</button>
        <button type="button" class="divide operator">
          <i class="fa-solid fa-divide"></i>
        </button>

        <button type="button" class="number">7</button>
        <button type="button" class="number">8</button>
        <button type="button" class="number">9</button>
        <button type="button" class="times operator">x</button>

        <button type="button" class="number">4</button>
        <button type="button" class="number">5</button>
        <button type="button" class="number">6</button>
        <button type="button" class="minus operator">-</button>

        <button type="button" class="number">1</button>
        <button type="button" class="number">2</button>
        <button type="button" class="number">3</button>
        <button type="button" class="plus operator">+</button>

        <button type="button" class="number zero">0</button>
        <button type="button" class="decimal">.</button>
        <button type="button" class="equal">=</button>
      </div>
    </div>
  </body>
</html>
